# Ported from the private repo's .gitlab-ci.yml. None of this repo's tests
# touch Gurobi (no test builds/solves the MPC model), so CI doesn't need a
# Gurobi license to pass -- gurobipy is still a runtime dependency
# (pip install -e . installs it), it's just never exercised here.
image: python:3.12

# Define the stages of our pipeline
stages:
  - lint
  - test

# Job 1: Check code quality with Ruff
lint-code:
  stage: lint
  script:
    - pip install ruff==0.15.11
    - ruff check .

# Job 2: Run the test suite
run-tests:
  stage: test
  script:
    - pip install -e .
    - pytest -m "not integration"
